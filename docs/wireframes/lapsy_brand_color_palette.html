<h2 class="sr-only">Lapsy のブランドカラーパレット。ロゴ由来のスカイブルーとサンイエローを軸に、プライマリ・アクセント・ニュートラル・ステート・ヒートマップ・カウントダウンの各用途に色を割り当てた一覧。</h2>
<style>
.pal{padding:.5rem 0;font-family:var(--font-sans)}
.pal .lab{font-size:13px;color:var(--color-text-secondary);margin:1.4rem 0 .5rem}
.pal .lab:first-child{margin-top:0}
.pal .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:10px}
.pal .sw{border-radius:var(--border-radius-md);overflow:hidden;border:0.5px solid var(--color-border-tertiary)}
.pal .cap{height:78px;display:flex;flex-direction:column;justify-content:space-between;padding:9px 10px}
.pal .cap b{font-size:12px;font-weight:500}
.pal .cap code{font-size:12px;font-family:var(--font-mono);letter-spacing:.02em}
.pal .role{font-size:11px;color:var(--color-text-tertiary);padding:6px 10px;background:var(--color-background-secondary)}
</style>
<div class="pal" id="pal"></div>
<script>
const S=[
 {label:"コアブランドカラー（ロゴアイコン由来）",items:[
  {hex:"#54C3F1",name:"スカイブルー",role:"主役・ロゴ背景"},
  {hex:"#FFC93C",name:"サンイエロー",role:"きらめき・アクセント"},
  {hex:"#FFFFFF",name:"スノーホワイト",role:"雪玉・サーフェス"},
  {hex:"#DDEFFB",name:"ペールブルー",role:"雪玉の影"},
  {hex:"#EAF6FD",name:"アイスブルー",role:"ハイライト"}]},
 {label:"プライマリ（スカイブルー）スケール",items:[
  {hex:"#EAF6FD",name:"50",role:"極淡い面"},
  {hex:"#DDEFFB",name:"100",role:"淡い面・選択"},
  {hex:"#B6E2F7",name:"200",role:"面・ホバー"},
  {hex:"#8AD3F4",name:"300",role:"補助"},
  {hex:"#54C3F1",name:"400 / base",role:"ブランド基準色"},
  {hex:"#2BAEE8",name:"500",role:"ボタン・白文字可"},
  {hex:"#1B95CC",name:"600",role:"押下・境界線"},
  {hex:"#14739F",name:"700",role:"濃色・文字"}]},
 {label:"アクセント（サンイエロー / コーラル）",items:[
  {hex:"#FFF1C9",name:"Yellow 100",role:"バッジ面"},
  {hex:"#FFE08A",name:"Yellow 300",role:"淡アクセント"},
  {hex:"#FFC93C",name:"Yellow 400",role:"達成・連続記録"},
  {hex:"#F5B11A",name:"Yellow 500",role:"濃アクセント"},
  {hex:"#FFB3A3",name:"Coral 300",role:"淡コーラル"},
  {hex:"#FF8366",name:"Coral 400",role:"副アクセント・緊急"},
  {hex:"#F0604A",name:"Coral 500",role:"濃コーラル"}]},
 {label:"ニュートラル（サーフェス & テキスト）",items:[
  {hex:"#F4F9FC",name:"App BG",role:"アプリ背景"},
  {hex:"#FFFFFF",name:"Surface",role:"カード面"},
  {hex:"#DCE7EF",name:"Border",role:"枠線・区切り"},
  {hex:"#93A1AC",name:"Text muted",role:"補助・プレースホルダ"},
  {hex:"#5B6B78",name:"Text secondary",role:"副次テキスト"},
  {hex:"#213240",name:"Text primary",role:"主要テキスト"}]},
 {label:"セマンティック ステート",items:[
  {hex:"#2FB877",name:"Success",role:"成功・保存完了"},
  {hex:"#FFB020",name:"Warning",role:"注意"},
  {hex:"#EF4B49",name:"Error",role:"エラー・削除"},
  {hex:"#54C3F1",name:"Info",role:"情報（=プライマリ）"}]},
 {label:"ヒートマップ強度（学習量・少→多）",items:[
  {hex:"#EDF3F7",name:"L0",role:"記録なし"},
  {hex:"#C5E6F8",name:"L1",role:"少"},
  {hex:"#8AD3F4",name:"L2",role:"中"},
  {hex:"#54C3F1",name:"L3",role:"多"},
  {hex:"#1B95CC",name:"L4",role:"最多"}]},
 {label:"カウントダウン緊急度（期限まで）",items:[
  {hex:"#2FB877",name:"余裕",role:"15日以上"},
  {hex:"#FFC93C",name:"接近",role:"14日以内"},
  {hex:"#FF8366",name:"緊急",role:"3日以内"},
  {hex:"#EF4B49",name:"超過",role:"期限切れ"}]}
];
function ink(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return (0.299*r+0.587*g+0.114*b)>150?'#15242F':'#FFFFFF';}
const root=document.getElementById('pal');
S.forEach(sec=>{
 const l=document.createElement('div');l.className='lab';l.textContent=sec.label;root.appendChild(l);
 const g=document.createElement('div');g.className='grid';
 sec.items.forEach(it=>{
  const fg=ink(it.hex);
  const sw=document.createElement('div');sw.className='sw';
  sw.innerHTML='<div class="cap" style="background:'+it.hex+';color:'+fg+'"><b>'+it.name+'</b><code>'+it.hex+'</code></div><div class="role">'+it.role+'</div>';
  g.appendChild(sw);
 });
 root.appendChild(g);
});
</script>
